name: CI

# This repo is a MIRROR of what npm publishes, not a build source.
#
# src/ is private, so nothing here can compile the product. What CI can do,
# and the only thing worth doing, is check that the artifact in dist/ is
# internally consistent and matches package.json. Both times the version
# drifted, the source was fine and the ARTIFACT was wrong, so the artifact is
# the right thing to test.
#
# Releases happen from the machine that holds src/, gated by prepublishOnly
# (build, version-lock, upgrade-path).

on:
  push:
  pull_request:

jobs:
  mirror-is-honest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: The shipped artifact parses
        run: |
          node --check dist/index.js
          node --check dist/mcp.js

      - name: The CLI reports the version package.json declares
        run: |
          WANT=$(node -p "require('./package.json').version")
          node dist/index.js --status | grep -q "Check v$WANT"
          echo "CLI reports v$WANT"

      - name: The MCP server announces that version over the wire
        run: node test/version-lock.mjs

      - name: The upgrade path off truth-gate still holds
        run: node test/upgrade-path.mjs

      - name: dist carries the copyright
        run: |
          head -c 400 dist/index.js | grep -q "GOL Productions"
          head -c 400 dist/mcp.js   | grep -q "GOL Productions"

      - name: No source leaked into the mirror
        run: |
          if [ -d src ]; then echo "src/ is present in the public mirror"; exit 1; fi
          echo "src/ is absent, as intended"
